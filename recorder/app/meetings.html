<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Scripts from the bundle's own files only, nothing remote (SAA-243 window
     hardening). Styles stay inline. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<!-- The recent-meetings window (SAA-217, Architecture Decision 18): the past
     week's captures, so the right meeting can be picked before acting on it.
     A row says which meeting it is — title, who was on it, when, how long,
     and one line for state notes (topics later) — and offers these actions: save its
     transcript, fix its speaker names, move it to the trash (a row's ⋯ menu, or
     several at once with the checkboxes). The Trash view restores or permanently
     deletes, one or several. It is deliberately not a place to read
     meetings: no moments, no search, no transcript, no summary. Reading
     meetings back happens in Claude.

     Loaded from file:// with no Node, like the identity window (SAA-243 window
     hardening): meetings-preload.js is all it reaches of the main process. It
     ships inside the bundle and loads no remote content. Every value from the
     data is put on the page with textContent. -->
<title>Recent meetings</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --bg: #ececee;
    --card: #ffffff;
    --border: #d8d8dc;
    --accent: #0a68d8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #f5f5f7;
      --muted: #98989d;
      --bg: #2a2a2c;
      --card: #1e1e20;
      --border: #3a3a3c;
      --accent: #4a9dff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    color: var(--fg);
    background: var(--bg);
    user-select: none;
    display: flex;
    flex-direction: column;
  }
  header { padding: 16px 20px 8px; flex: 0 0 auto; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0; }
  #list { flex: 1 1 auto; overflow-y: auto; padding: 4px 20px 16px; }
  .day { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.04em; margin: 14px 0 6px; }
  .day:first-child { margin-top: 6px; }
  .row { display: flex; gap: 12px; align-items: flex-start; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; }
  .main { flex: 1 1 auto; min-width: 0; }
  .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .when { color: var(--muted); font-size: 12px; white-space: nowrap; flex: 0 0 auto; }
  .people { color: var(--fg); font-size: 12px; margin-top: 1px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .people.none { color: var(--muted); font-style: italic; }
  .line { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .acts { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }
  .row.dim .title, .row.dim .people { color: var(--muted); }
  button { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--card); color: var(--fg); white-space: nowrap; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.45; }
  #filter { display: inline-flex; margin-top: 10px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  #filter button { border: 0; border-radius: 0; background: transparent; padding: 3px 12px; }
  #filter button + button { border-left: 1px solid var(--border); }
  #filter button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  #filter button[aria-pressed="true"]:hover { color: #fff; }
  #empty { color: var(--muted); padding: 24px 0; text-align: center; }
  .bar { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .bar #filter, .bar #view { margin-top: 0; }
  #view { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  #view button { border: 0; border-radius: 0; background: transparent; padding: 3px 12px; }
  #view button + button { border-left: 1px solid var(--border); }
  #view button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  #view button[aria-pressed="true"]:hover { color: #fff; }
  #selbar { display: none; gap: 8px; align-items: center; margin-top: 10px; color: var(--muted); font-size: 12px; }
  #selbar.on { display: flex; }
  button.danger:hover:not(:disabled) { border-color: #d70015; color: #d70015; }
  .pick { flex: 0 0 auto; margin-top: 2px; }
  .menuwrap { position: relative; }
  .menu { position: absolute; right: 0; top: 100%; z-index: 5; margin-top: 2px; background: var(--card);
    border: 1px solid var(--border); border-radius: 6px; padding: 3px; min-width: 130px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18); }
  .menu button { display: block; width: 100%; text-align: left; border: 0; }
</style>
</head>
<body>
<header>
  <h1>Recent meetings</h1>
  <p class="sub" id="sub">The past 7 days. Pick a meeting to save its transcript or fix who said what.</p>
  <div class="bar">
    <div id="view" role="group" aria-label="View"></div>
    <div id="filter" role="group" aria-label="Show"></div>
  </div>
  <div id="selbar"></div>
</header>
<div id="list"></div>
<script src="meetings-page.js"></script>
</body>
</html>
