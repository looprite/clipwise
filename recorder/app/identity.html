<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Scripts from the bundle's own files only, nothing remote (SAA-243 window
     hardening). Styles stay inline. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; media-src file:">
<!-- "Who was on this call?" (SAA-114; one window since SAA-260 step 4).

     One field: a chip per person on the call. The calendar's invitees arrive as
     chips tagged "invited"; one known only by address is named by clicking it.
     Typing searches the people this member can see (GET /captures/people, through
     main.js); a pick carries that person's id, a typed name is tagged "new" when
     the search answered without it and "not checked" when it could not answer.
     More than six invitees are one chip, "N invited · not confirmed", and none of
     them is an attendee unless added from "Show the N". The host's own name never
     becomes a chip. The rules are identity-rules.js's people field, so
     check-calendar-prefill.js runs them without a window; this page renders them.

     The same window opens at stop, from the tray's Later item, for Change
     attendees… and for Name voices / Fix names (main.js's mode). On a group call
     the voices part fills in when diarize has split the call: a row per voice,
     longest first, each choosing among the chips, "Leave unnamed" or "Add
     someone…". Save never waits for it; rows not touched are saved unnamed.

     Skip leaves the call unidentified for good (Cancel, in a correction, keeps
     the saved answer; Later, in Name voices, leaves the voices for the tray).
     Closing the window is Later (SAA-197).

     Loaded from file:// with no Node (SAA-243 window hardening): contextIsolation
     and sandbox on, nodeIntegration off; identity-preload.js is all it reaches of
     the main process. It ships in the bundle and loads no remote content. Clips
     play from local files this Mac's capture wrote.
     From a voice it reads voiceIndex and clipPaths, and from a line its text. -->
<title>Who was on this call?</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --bg: #ececee;
    --field-bg: #ffffff;
    --field-border: #c6c6c8;
    --chip-bg: #e3e3e8;
    --accent: #0a68d8;
    --warn: #c4302b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #f5f5f7;
      --muted: #98989d;
      --bg: #2a2a2c;
      --field-bg: #1e1e20;
      --field-border: #48484a;
      --chip-bg: #3a3a3d;
      --accent: #4a9dff;
      --warn: #ff6961;
    }
  }
  * { box-sizing: border-box; }
  html { overflow: hidden; background: var(--bg); }
  body {
    margin: 0;
    padding: 16px 18px 14px;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    color: var(--fg);
    background: var(--bg);
    user-select: none;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  #call-line { color: var(--muted); font-size: 11px; margin: 0 0 10px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  input, select, button { font: inherit; color: var(--fg); }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 4px 12px;
    border-radius: 6px;
    border: 1px solid var(--field-border);
    background: var(--field-bg);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.link { border: none; background: none; color: var(--accent); padding: 0 2px; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.5; }

  /* The field: chips, then the text box. The chip box stops at four rows and
     scrolls inside; the page itself never scrolls. */
  #field-box { border: 1px solid var(--field-border); border-radius: 6px;
    background: var(--field-bg); padding: 4px; }
  #chips { display: flex; flex-wrap: wrap; gap: 4px; max-height: 100px; overflow-y: auto; }
  #chips:empty { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; max-width: 100%;
    padding: 0 4px 0 8px; border-radius: 11px; background: var(--chip-bg); font-size: 12px; }
  .chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .tag { color: var(--muted); font-size: 10px; }
  .chip .add-name { color: var(--accent); font-size: 10px; white-space: nowrap; }
  .chip[data-email]:not([data-named]) { cursor: pointer; }
  .chip input { width: 150px; height: 18px; padding: 0 4px; font-size: 12px;
    border: 1px solid var(--field-border); border-radius: 4px; background: var(--field-bg); user-select: text; }
  .chip .remove { border: none; background: none; padding: 0 2px; color: var(--muted); line-height: 1; }
  #large { display: flex; align-items: center; gap: 6px; margin: 2px 0; font-size: 12px; }
  #large:empty { display: none; }
  .large-chip { padding: 2px 8px; border-radius: 11px; background: var(--chip-bg); }
  #large-suggestions { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 4px; }
  #large-suggestions:empty { display: none; }
  #large-suggestions button, #recent button, #results button { padding: 1px 8px; font-size: 12px; border-radius: 11px; }
  #people-input { width: 100%; border: none; background: transparent; padding: 4px 4px; user-select: text; }
  #people-input:focus { outline: none; }
  #results, #recent { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 6px 0 0; font-size: 12px; }
  #results:empty, #recent:empty { display: none; }
  #recent .label { color: var(--muted); font-size: 11px; }
  .note { font-size: 11px; color: var(--muted); margin: 6px 0 0; }
  .note.warn { color: var(--warn); }
  .note:empty { display: none; }

  .section { margin-top: 12px; }
  .section-label { display: block; font-size: 11px; color: var(--muted); margin: 0 0 4px; }
  .segmented { display: flex; border: 1px solid var(--field-border); border-radius: 6px; overflow: hidden; }
  .segmented button { flex: 1 1 0; border: none; border-radius: 0; }
  .segmented button + button { border-left: 1px solid var(--field-border); }
  .segmented button.active { background: var(--accent); color: #fff; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .check input { margin: 0; }

  /* The voices part. While it reads "Finding voices…" it keeps the height of
     two rows, so the window does not grow when they arrive. */
  #voices-part[hidden] { display: none; }
  #voices-finding { color: var(--muted); font-size: 12px; min-height: 76px; padding: 4px 0; }
  #voices-finding[hidden] { display: none; }
  .voice-row { border: 1px solid var(--field-border); border-radius: 6px; background: var(--field-bg);
    padding: 5px 8px; margin-bottom: 4px; }
  .voice-row .top { display: flex; align-items: center; gap: 8px; }
  .voice-row .play { padding: 1px 8px; }
  .voice-row .label { font-weight: 500; }
  .voice-row .talk { color: var(--muted); font-size: 11px; }
  .voice-row select { margin-left: auto; max-width: 190px; padding: 2px 4px;
    border: 1px solid var(--field-border); border-radius: 5px; background: var(--field-bg); }
  .voice-row .quote { color: var(--muted); font-size: 11px; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .voice-row .no-clip { color: var(--muted); font-size: 11px; margin-top: 2px; }
  #prints-nudge { margin: 0 0 6px; }
  #prints-nudge[hidden] { display: none; }
  .voice-row .add input { width: 100%; margin-top: 4px; padding: 3px 6px; font-size: 12px;
    border: 1px solid var(--field-border); border-radius: 5px; background: var(--field-bg); user-select: text; }
  #voices-links { display: flex; gap: 10px; font-size: 12px; }
  #voices-links:empty { display: none; }

  #actions { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  #recorded-by { flex: 1 1 auto; color: var(--muted); font-size: 11px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
  <h1>Who was on this call?</h1>
  <p id="call-line"></p>

  <div id="field-box">
    <div id="chips"></div>
    <div id="large"></div>
    <div id="large-suggestions"></div>
    <input id="people-input" type="text" spellcheck="false" autocomplete="off" placeholder="Add people — type a name">
  </div>
  <div id="results"></div>
  <div id="recent"></div>
  <p class="note" id="new-line"></p>
  <p class="note warn" id="at-hint"></p>
  <p class="note" id="field-hint"></p>

  <div class="section">
    <span class="section-label" id="scope-label">Personal or work?</span>
    <div class="segmented" id="scope" role="group">
      <button type="button" data-value="work">Work</button>
      <button type="button" data-value="personal">Personal</button>
    </div>
  </div>

  <!-- SAA-260 11-07: unticked unless the saved answer says so (correct, voices). -->
  <div class="section" id="mic-section">
    <label class="check"><input type="checkbox" id="mic-shared"> Someone else spoke into my mic</label>
  </div>

  <div class="section" id="voices-part" hidden>
    <span class="section-label">Voices on the call</span>
    <p class="note" id="prints-nudge" hidden>Voice recognition is off. <button type="button" class="link" id="prints-nudge-open">Recognize voices…</button></p>
    <div id="voices-finding">Finding voices… You can save now; Clipwise will ask you to name them from the menu bar.</div>
    <div id="voice-rows"></div>
    <div id="voices-links"></div>
  </div>

  <div id="actions">
    <span id="recorded-by"></span>
    <button id="skip" type="button">Skip</button>
    <button id="save" type="button" class="primary">Save</button>
  </div>

<script src="people-name.js"></script>
<script src="identity-rules.js"></script>
<script src="identity-page.js"></script>
</body>
</html>
