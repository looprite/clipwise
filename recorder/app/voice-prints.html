<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Scripts from the bundle's own files only, nothing remote (SAA-243 window
     hardening). Styles stay inline. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<!-- The voice prints opt-in screen (SAA-260 step 3, SAA-196's 10-08 decision):
     what is stored and about whom, that some places require consent from the
     people on the call, and that it can be turned off with the prints deleted.
     Off by default; opened only from the tray's "Recognize voices…".

     Turning off deletes the voice prints (voice-prints/). Recordings are not
     affected: each keeps its own files, the diarize file's per-voice
     measurements included, until that recording is deleted.

     The statement is not in this page: it is the repo's copy for the current
     version, notice/voice-prints-statement-v<N>.txt, which main.js reads
     (voice-prints.js readStatement) and sends with the window's data, with the
     advice line above it. The setup window's voices step shows the same file.
     Turning on sends the version shown, and main.js refuses any other.

     Loaded from file:// with no Node, like the other windows (SAA-243 window
     hardening): voice-prints-preload.js is all it reaches of the main process.
     It ships inside the bundle and loads no remote content. Every name from the
     data is put on the page with textContent. -->
<title>Recognize voices</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --bg: #ececee;
    --card: #ffffff;
    --border: #d8d8dc;
    --accent: #0a68d8;
    --danger: #c4281c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #f5f5f7;
      --muted: #98989d;
      --bg: #2a2a2c;
      --card: #1e1e20;
      --border: #3a3a3c;
      --accent: #4a9dff;
      --danger: #ff6b5e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    color: var(--fg);
    background: var(--bg);
    user-select: none;
    display: flex;
    flex-direction: column;
  }
  main { flex: 1 1 auto; overflow-y: auto; padding: 18px 22px 8px; }
  p { margin: 0 0 10px; }
  ul { margin: 0 0 14px; padding-left: 20px; }
  li { margin: 0 0 6px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  h2 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 4px 0 8px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; border-top: 1px solid var(--border); }
  .row:first-child { border-top: none; }
  .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .empty { color: var(--muted); }
  .error { color: var(--danger); }
  .error:empty { display: none; }
  .pick { flex: 0 0 auto; margin: 0; }
  .row .who { flex: 1 1 auto; }
  #selbar { display: flex; gap: 8px; align-items: center; margin: 0 0 8px; color: var(--muted); font-size: 12px; }
  #selbar[hidden] { display: none; }
  footer { flex: 0 0 auto; display: flex; justify-content: flex-end; gap: 8px; padding: 10px 22px 16px; }
  button { font: inherit; padding: 4px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--fg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  button.small { padding: 2px 10px; font-size: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <!-- Advice, not part of the statement (SAA-275 part 3, decided 2026-11-10):
       outside #statement, so the statement's words and its version stay as
       members agreed to them. -->
  <p id="advice"></p>
  <div id="statement"></div>
  <p class="error" id="statement-error"></p>
  <div id="prints" hidden>
    <h2>Voice prints on this Mac</h2>
    <div id="selbar" hidden></div>
    <div class="card" id="list"></div>
  </div>
</main>
<footer>
  <button id="later">Not now</button>
  <button id="on" class="primary" disabled>Turn on</button>
  <button id="off" class="danger" hidden>Turn off and delete prints</button>
  <button id="done" hidden>Done</button>
</footer>
<script src="voice-prints-page.js"></script>
</body>
</html>
